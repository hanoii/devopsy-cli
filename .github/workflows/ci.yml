name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The completion scripts are tested in each shell found (bash is there).
      - run: sudo apt-get update -q && sudo apt-get install -yq zsh fish
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: shellcheck -s sh install.sh
