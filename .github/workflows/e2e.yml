name: e2e

# devopsy against real servers in Docker (e2e/): on demand, and nightly
# when main moved since the last run that passed. Slower than ci's tests.
# Nightly with a 1-second heartbeat beat (drops in seconds); on demand,
# beat 5 runs everything with the real timeouts.
on:
  workflow_dispatch:
    inputs:
      beat:
        description: "Heartbeat beat in seconds (5: the real timeouts)"
        default: "1"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  actions: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # Two jobs, each running half the tests (E2E_SHARD) on two lanes of
      # servers at once (E2E_LANES): a runner's four CPUs.
      matrix:
        shard: [1, 2]
    steps:
      - id: last
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list -R "$GITHUB_REPOSITORY" --workflow e2e.yml --status success --limit 1 --json headSha -q '.[0].headSha')
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "nothing new since $last"
            echo skip=1 >>"$GITHUB_OUTPUT"
          fi
      # The tags too: TestOlderServer builds devopsy from one.
      - uses: actions/checkout@v7
        if: steps.last.outputs.skip != '1'
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        if: steps.last.outputs.skip != '1'
        with:
          go-version-file: go.mod
      # The tests' last times, which order each job's tests slowest first.
      - uses: actions/cache@v6
        if: steps.last.outputs.skip != '1'
        with:
          path: ~/.cache/devopsy-e2e
          key: e2e-times-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: e2e-times-${{ matrix.shard }}-
      - if: steps.last.outputs.skip != '1'
        env:
          E2E_BEAT: ${{ inputs.beat || '1' }}
          E2E_LANES: "2"
          E2E_SHARD: ${{ matrix.shard }}/2
        run: go test -tags e2e -count=1 -v -timeout 35m ./e2e
