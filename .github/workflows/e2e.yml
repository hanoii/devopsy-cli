name: e2e

# devopsy against real servers in Docker (e2e/): on demand and nightly,
# slower than ci's tests.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -tags e2e -count=1 -v ./e2e
